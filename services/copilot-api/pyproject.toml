[project]
name = "stockcopilot-api"
version = "0.1.0"
description = "StockCopilot Copilot API: FastAPI + LangGraph + Gemini over the Road2Tech v2 dataset."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.140,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-google-genai>=4.4,<5",
  "ag-ui-langgraph>=0.0.45",
  "psycopg[binary,pool]>=3.2",
  "mangum>=0.19",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockcopilot"]

[tool.uv]
# Only resolve releases that are at least two weeks old (supply-chain hygiene).
exclude-newer = "2026-09-26T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "ISC"]
# Pydantic generic models keep the explicit Generic[T] form.
ignore = ["UP046", "UP047"]
